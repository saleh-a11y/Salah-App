function index(){Q.s.forEach((p,i)=>SSTART[i+1]=p);Q.j.forEach((p,i)=>JSTART[i+1]=p);Q.p.forEach((x,i)=>PINFO[i+1]={s:x[0],j:x[1]})}

/* the plain 13-line Qur'ān (30 juz, 847 pages) ships inside the app; page n of the PDF is page n of the muṣḥaf.

const CURL='https://github.com/saleh-a11y/Salah-App/releases/download/quran-colour/quran-13-line-colour.pdf',CMB=97;

  const w=c.width,h=c.height,d=new Uint8ClampedArray(c.getContext('2d').getImageData(0,0,w,h).data.buffer),dark=(x,y)=>{const i=(y*w+x)*4;return d[i]+d[i+1]+d[i+2]<600};

  let t=0,b=h-1,l=0,r=w-1;while(t<b&&!row(t))t++;while(b>t&&!row(b))b--;while(l<r&&!col(l))l++;while(r>l&&!col(r))r--;
  if(r-l<w*.3||b-t<h*.3)return[0,0,w,h];const px=Math.round(w*.008);l=Math.max(0,l-px);t=Math.max(0,t-px);r=Math.min(w-1,r+px);b=Math.min(h-1,b+px);return[l,t,r-l+1,b-t+1]}

  const key=PV+OFF+(FILL?'F':'f')+':'+p+':'+book.clientWidth+'x'+book.clientHeight;if(CACHE.has(key))return CACHE.get(key);

  const pr=(async()=>{const pg=await PDF.getPage(n),W=Math.round(book.clientWidth*(devicePixelRatio||1)),H=Math.round(book.clientHeight*(devicePixelRatio||1)),v0=pg.getViewport({scale:1}),sc=Math.max(W/v0.width,H/v0.height)*1.08,v=pg.getViewport({scale:sc});
    const c=document.createElement('canvas');c.width=Math.ceil(v.width);c.height=Math.ceil(v.height);const x=c.getContext('2d',{willReadFrequently:true});x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:x,viewport:v}).promise;
    const [l,t,w,h]=trim(c),k=Math.min(W/w,H/h),o=document.createElement('canvas');o.width=FILL?W:Math.round(w*k);o.height=FILL?H:Math.round(h*k);
    const y=o.getContext('2d');y.imageSmoothingQuality='high';y.fillStyle='#fff';y.fillRect(0,0,o.width,o.height);y.drawImage(c,l,t,w,h,0,0,o.width,o.height);c.width=c.height=0;return o})();
  CACHE.set(key,pr);if(CACHE.size>8)CACHE.delete(CACHE.keys().next().value);return pr}
function draw(el,p){
  el.classList.add('scan');el.innerHTML='<div class="wait">Loading page…</div>'+(BM.some(b=>b.p===p)?'<div class="ribbon" aria-hidden="true"></div>':'')+'<div class="shade"></div>';el.dataset.p=p;
  render(p).then(c=>{if(el.dataset.p!=p)return;const w=el.querySelector('.wait');if(!c){if(w)w.textContent=PV==='colour'?'This page is not in your colour PDF':'Page not found';return}
    const k=document.createElement('canvas');k.width=c.width;k.height=c.height;k.getContext('2d').drawImage(c,0,0);if(w)w.replaceWith(k);else el.prepend(k)}).catch(()=>{const w=el.querySelector('.wait');if(w)w.textContent='Could not show this page'})}
function prefetch(){if(PDF){render(P+1);render(P-1)}}

/* the book: one visible page; during a turn a second page sits underneath */
const book=$('#book');let cur,under=null,busy=false;
function mk(cls){const d=document.createElement('div');d.className='page '+(cls||'');book.appendChild(d);return d}
function calm(on){document.body.classList.toggle('calm',on);if(on){const h=$('#hint');if(h&&!h.dataset.seen){h.dataset.seen=1;setTimeout(()=>h.style.opacity=0,3500)}}}
function show(p){book.innerHTML='';cur=mk();draw(cur,p);under=null;P=p;bar();save();prefetch()}
function bar(){const i=PINFO[P];$('#ttl').textContent=SUR[i.s-1];$('#jz').textContent='Juz '+i.j;$('#pn').textContent=P+' / '+N;$('#sl').value=P;
  const on=BM.some(b=>b.p===P);$('#bm').classList.toggle('on',on);$('#bm').setAttribute('aria-pressed',on)}
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1800)}
function crossed(a,b){ // tell the reader when a turn enters a new surah or juz
  const h=Q.h[b-1];
  if(h&&b>a)toast('Sūrah '+SUR[h-1]+' begins');else if(PINFO[a].j!==PINFO[b].j)toast('Juz '+PINFO[b].j);}

/* turning: angle 0 = flat, 180 = turned over the spine (the right edge, as in an Arabic book) */
function setAngle(el,a){el.style.transform='rotateY('+a+'deg)';const s=el.querySelector('.shade');if(s)s.style.opacity=Math.sin(a*Math.PI/180)*.9;
  if(under){const u=under.querySelector('.shade');if(u)u.style.opacity=(1-a/180)*.6}}
function prep(dir){ // dir 1 = next page (the current page turns away), -1 = previous (it turns back in)
  if(dir>0){if(P>=N)return null;under=mk('under');book.insertBefore(under,cur);draw(under,P+1);cur.classList.add('turn');return cur}
  if(P<=1)return null;under=cur;under.classList.add('under');const t=mk('turn');draw(t,P-1);setAngle(t,180);return t}
function animate(el,from,to,done){busy=true;const t0=performance.now(),d=Math.max(160,Math.abs(to-from)*2.6);
  (function f(now){const k=Math.min(1,(now-t0)/d),e=1-Math.pow(1-k,3);setAngle(el,from+(to-from)*e);if(k<1)requestAnimationFrame(f);else{busy=false;done()}})(t0)}
function turn(dir){if(busy||!PDF)return;const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;const from=P,to=P+dir;if(to<1||to>N)return;
  if(reduce){show(to);crossed(from,to);return}
  const el=prep(dir);if(!el)return;
  calm(true);if(dir>0)animate(el,0,180,()=>{show(to);crossed(from,to)});else animate(el,180,0,()=>{show(to);crossed(from,to)});
}
/* drag to turn: the page follows the finger; swipe right = next page */
let g=null;
$('#stage').addEventListener('touchstart',e=>{if(busy||!PDF)return;g={x:e.touches[0].clientX,y:e.touches[0].clientY,t:performance.now(),dir:0,el:null}},{passive:true});
$('#stage').addEventListener('touchmove',e=>{if(!g)return;const dx=e.touches[0].clientX-g.x,dy=e.touches[0].clientY-g.y;
  if(!g.dir){if(Math.abs(dx)<10||Math.abs(dy)>Math.abs(dx))return;g.dir=dx>0?1:-1;g.el=prep(g.dir);if(!g.el){g=null;return}}
  const W=book.clientWidth,k=Math.min(1,Math.abs(dx)/W);setAngle(g.el,g.dir>0?k*180:180-k*180)},{passive:true});
$('#stage').addEventListener('touchend',e=>{if(!g)return;const G=g;g=null;
  if(!G.el){const x=e.changedTouches[0].clientX,r=book.getBoundingClientRect();if(Math.abs(x-G.x)<8){if(x<r.left+r.width*.25)turn(1);else if(x>r.right-r.width*.25)turn(-1);else calm(!document.body.classList.contains('calm'))}return}
  calm(true);
  const dx=e.changedTouches[0].clientX-G.x,v=Math.abs(dx)/(performance.now()-G.t),W=book.clientWidth,k=Math.min(1,Math.abs(dx)/W),go=k>.35||v>.5;
  const a=G.dir>0?k*180:180-k*180,from=P,to=P+G.dir;
  if(G.dir>0)animate(G.el,a,go?180:0,()=>{if(go){show(to);crossed(from,to)}else show(from)});
  else animate(G.el,a,go?0:180,()=>{if(go){show(to);crossed(from,to)}else show(from)});
});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')turn(1);if(e.key==='ArrowRight')turn(-1)});
book.addEventListener('click',e=>{if(matchMedia('(hover:hover)').matches){const r=book.getBoundingClientRect();if(e.clientX<r.left+r.width*.25)turn(1);else if(e.clientX>r.right-r.width*.25)turn(-1);else calm(!document.body.classList.contains('calm'))}});

/* page slider with a live "page · juz · surah" bubble */
const sl=$('#sl'),bub=$('#bub');
function bubble(p){const i=PINFO[p];bub.innerHTML='<b>'+p+'</b>Juz '+i.j+' · '+SUR[i.s-1];bub.hidden=false}
sl.addEventListener('input',()=>bubble(+sl.value));
sl.addEventListener('change',()=>{bub.hidden=true;calm(false);const to=+sl.value;if(to!==P){const from=P;show(to);crossed(Math.min(from,to),to)}});
['pointerup','touchend','blur'].forEach(ev=>sl.addEventListener(ev,()=>setTimeout(()=>bub.hidden=true,150)));

/* bookmarks */
$('#bm').onclick=()=>{const i=BM.findIndex(b=>b.p===P);if(i>=0){BM.splice(i,1);toast('Bookmark removed')}else{BM.unshift({p:P,t:Date.now()});toast('Page '+P+' bookmarked')}save();show(P)};

/* index sheet: surahs, juz, bookmarks, go to page */
function list(){const L=$('#list');let h='';
  if(TAB==='s')h=SUR.map((n,i)=>'<button class="row'+(PINFO[P].s===i+1?' cur':'')+'" data-p="'+SSTART[i+1]+'"><span class="no">'+(i+1)+'</span><span class="nm">'+n+'<small>Juz '+PINFO[SSTART[i+1]].j+'</small></span><span class="pg">p. '+SSTART[i+1]+'</span></button>').join('');
  if(TAB==='j')h=JUZ.map((x,j)=>'<button class="row'+(PINFO[P].j===j+1?' cur':'')+'" data-p="'+JSTART[j+1]+'"><span class="no">'+(j+1)+'</span><span class="nm">Juz '+(j+1)+'<small>Starts '+SUR[x[0]-1]+' '+x[0]+':'+x[1]+'</small></span><span class="pg">p. '+JSTART[j+1]+'</span></button>').join('');
  if(TAB==='b')h=BM.length?BM.map(b=>'<button class="row" data-p="'+b.p+'"><span class="no">🔖</span><span class="nm">Page '+b.p+'<small>'+SUR[PINFO[b.p].s-1]+' · Juz '+PINFO[b.p].j+' · '+new Date(b.t).toLocaleDateString()+'</small></span><span class="pg" data-del="'+b.p+'" aria-label="Remove bookmark">✕</span></button>').join(''):'<div class="empty">No bookmarks yet. Tap 🔖 at the top to bookmark a page.</div>';
  L.innerHTML=h;const c=L.querySelector('.cur');if(c)c.scrollIntoView({block:'center'});
  document.querySelectorAll('.tabs3 button').forEach(b=>b.classList.toggle('on',b.dataset.t===TAB))}
function openIdx(){$('#ov').hidden=false;list();srcUI();openIdxSrc()}function closeIdx(){$('#ov').hidden=true}
$('#idx').onclick=openIdx;$('#pn').onclick=()=>{openIdx();setTimeout(()=>$('#jp').focus(),50)};$('#ovx').onclick=closeIdx;
$('#ov').onclick=e=>{if(e.target.id==='ov')closeIdx()};
document.querySelector('.tabs3').onclick=e=>{const b=e.target.closest('button');if(b){TAB=b.dataset.t;list()}};
$('#list').onclick=e=>{const d=e.target.closest('[data-del]');if(d){BM=BM.filter(b=>b.p!==+d.dataset.del);save();list();bar();return}
  const r=e.target.closest('.row');if(r){closeIdx();show(+r.dataset.p)}};
function jump(){const v=Math.round(+$('#jp').value);if(v>=1&&v<=N){closeIdx();show(v);$('#jp').value=''}else{$('#jp').value='';$('#jp').placeholder='Enter 1 to 847'}}
$('#jgo').onclick=jump;$('#jp').addEventListener('keydown',e=>{if(e.key==='Enter')jump()});
/* colour-coded pages: download once, switch, remove */
const mb=b=>Math.round(b/1e6);
function srcUI(){
  $('#cseg').hidden=false;$('#src').hidden=false;
  if(!QF){$('#srcInfo').textContent='Colour pages can only be downloaded in the installed app.';$('#cGet').hidden=true;$('#cDel').hidden=true;return}
  document.querySelectorAll('#cseg button').forEach(b=>b.classList.toggle('on',b.dataset.v===PV));
  const g=$('#cGet');let t;
  if(CST.have){t='Colour-coded (tajweed) pages are saved on this phone ('+mb(CST.size)+' MB). Switch between Colour and Plain at the top.';g.hidden=true}
  else if(CST.busy||CPCT!=null){t='Downloading the colour-coded pages… '+(CPCT?CPCT.percent+'% ('+mb(CPCT.done)+' of '+mb(CPCT.total)+' MB)':'starting')+'. You can keep reading meanwhile.';g.hidden=false;g.disabled=true;g.textContent='Downloading…'}
  else{t=CERR?CERR+' Tap to continue where it stopped.':'Read in colour-coded tajweed pages. One download of about '+CMB+' MB (Wi-Fi is best), then they work offline.';g.hidden=false;g.disabled=false;g.textContent=CST.partial>0?'Continue download':'Download colour pages ('+CMB+' MB)'}
  $('#srcInfo').textContent=t;$('#cDel').hidden=!CST.have}
async function usePV(v){if(v===PV&&PDF)return;const keep=PV||'plain';PV=v;toast(v==='colour'?'Opening colour pages…':'Opening plain pages…');
  try{await loadPdf()}catch(e){PV=keep;toast('Could not open those pages');try{await loadPdf()}catch(x){}}
  try{localStorage.setItem('q_pv',PV)}catch(e){}show(P);srcUI()}
let lis=null;
async function cDownload(){
  if(!QF||CST.busy)return;CERR='';CPCT=null;CST.busy=true;srcUI();
  if(!lis){lis=true;try{Promise.resolve(QF.addListener('progress',e=>{CPCT=e;if(!$('#ov').hidden)srcUI()})).catch(()=>{})}catch(e){}}
  try{CST=await QF.download(await cUrl());CPCT=null;toast('Colour pages ready');closeIdx();await usePV('colour');calm(false)}
  catch(e){CPCT=null;await cStatus();CST.busy=false;CERR=/busy/.test(String(e&&e.message||e))?'':'The download stopped (check your internet).'}
  srcUI()}
$('#cGet').onclick=cDownload;
$('#cseg').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.v==='colour'&&!CST.have){openIdx();$('#src').scrollIntoView({block:'start'});toast('Download the colour pages first');return}
  usePV(b.dataset.v)};
function fitUI(){document.querySelectorAll('#fitSeg button').forEach(b=>b.classList.toggle('on',(b.dataset.v==='fill')===FILL))}fitUI();
$('#fitSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;FILL=b.dataset.v==='fill';try{localStorage.setItem('q_fit',FILL?'fill':'fit')}catch(x){}fitUI();CACHE.clear();if(PDF)show(P)};
$('#cDel').onclick=async()=>{if(PV==='colour')await usePV('plain');try{CST=await QF.remove()}catch(e){}toast('Colour pages removed from this phone');srcUI()};
async function openIdxSrc(){await cStatus();srcUI()}

/* the phone's back button closes the index before it closes the reader */
window.qrBack=()=>{if(!$('#ov').hidden){closeIdx();return true}return false};
$('#cls').onclick=()=>{try{parent.qrClose()}catch(e){history.back()}};
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(PDF)show(P)},200)});
fetch('quran/index.json').then(r=>r.json()).then(async d=>{Q=d;index();bar();cur=mk();cur.classList.add('scan');cur.innerHTML='<div class="wait">Opening the Qur\'ān…</div>';
  await cStatus();if(CST.busy){ // a download from before is still running: follow it
    try{QF.addListener('progress',e=>{CPCT=e;if(!$('#ov').hidden)srcUI()});lis=true}catch(e){}
    const iv=setInterval(async()=>{await cStatus();if(!CST.busy){clearInterval(iv);CPCT=null;srcUI()}},3000)}
  try{await loadPdf();show(P);srcUI()}catch(e){cur.querySelector('.wait').textContent='Could not open the Qur\'ān'}});
</script>
</body></html>
