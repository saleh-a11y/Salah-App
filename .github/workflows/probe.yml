name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: photos
        run: |
          pip install pillow >/dev/null 2>&1 || pip install --break-system-packages pillow >/dev/null
          python3 tools/photos.py
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add cand && git commit -qm "candidates [skip ci]" && git push -q origin HEAD:probe
