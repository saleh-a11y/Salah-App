name: probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: fetch
        run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/124 Mobile Safari/537.36"
          curl -sSL -A "$UA" "https://masjidboardlive.com/boards/script.js?1791452611000" -o /tmp/s; wc -c /tmp/s
          grep -o -i -E '.{0,700}(islamicDateAdjust|islamicDate=|islamic-umalqura|islamic-civil|ummalqura|umalqura).{0,900}' /tmp/s | head -8
