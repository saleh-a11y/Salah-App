name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm ci

      - name: Add Android platform if needed
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Make sure INTERNET permission is in the manifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.INTERNET" />\n</manifest>#' "$MANIFEST"
          fi
          grep -n 'android.permission.INTERNET' "$MANIFEST"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          echo "Using Android SDK at $ANDROID_HOME"
          chmod +x gradlew
          test -f keystore/debug.keystore
          ./gradlew assembleDebug --no-daemon

      - name: Check APK is signed with the committed keystore
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          EXPECTED=$(keytool -list -v -keystore android/keystore/debug.keystore -storepass android -alias androiddebugkey \
            | grep 'SHA256:' | sed 's/.*SHA256: //; s/://g' | tr 'A-F' 'a-f')
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | grep 'SHA-256 digest' | head -1 | sed 's/.*: //')
          echo "expected: $EXPECTED"
          echo "actual:   $ACTUAL"
          [ "$EXPECTED" = "$ACTUAL" ]

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SalahTracker.apk

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          git push origin :refs/tags/latest || true
          gh release create latest SalahTracker.apk \
            --title "latest" \
            --notes "Debug APK built from ${GITHUB_SHA} on ${GITHUB_REF_NAME}." \
            --target "${GITHUB_SHA}" \
            --latest
