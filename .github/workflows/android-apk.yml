name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm ci

      - name: Add Android platform if needed
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Make sure INTERNET permission is in the manifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.INTERNET" />\n</manifest>#' "$MANIFEST"
          fi
          grep -n 'android.permission.INTERNET' "$MANIFEST"

      - name: Stamp build number
        env:
          APP_READ_TOKEN: ${{ secrets.APP_READ_TOKEN }}
        run: |
          N=${{ github.run_number }}
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
          grep -q '<script src="capacitor.js"></script>' www/index.html
          grep -q "registerPlugin" www/capacitor.js
          sed -i "s/const BUILD='__BUILD__'/const BUILD='$N'/" www/index.html
          # Private repository: put the read-only key into the app so it can fetch updates and the colour Qur'an.
          if [ -n "$APP_READ_TOKEN" ]; then
            sed -i "s|const GHT='__GHT__'|const GHT='$APP_READ_TOKEN'|" www/index.html www/quran.html
            grep -q "const GHT='__GHT__'" www/index.html www/quran.html && exit 1
            echo "Read-only GitHub key added."
          fi
          grep -q "const BUILD='$N'" www/index.html
          sed -i -E "s/versionCode [0-9]+/versionCode $N/; s/versionName \"[^\"]*\"/versionName \"1.$N\"/" android/app/build.gradle
          grep -nE "versionCode|versionName" android/app/build.gradle

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          echo "Using Android SDK at $ANDROID_HOME"
          chmod +x gradlew
          test -f keystore/debug.keystore
          ./gradlew assembleDebug --no-daemon

      - name: Check APK is signed with the committed keystore
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          EXPECTED=$(keytool -list -v -keystore android/keystore/debug.keystore -storepass android -alias androiddebugkey \
            | grep 'SHA256:' | sed 's/.*SHA256: //; s/://g' | tr 'A-F' 'a-f')
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | grep 'SHA-256 digest' | head -1 | sed 's/.*: //')
          echo "expected: $EXPECTED"
          echo "actual:   $ACTUAL"
          [ "$EXPECTED" = "$ACTUAL" ]

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SalahTracker.apk

      - name: Publish "preview" pre-release (all-phases branch only; the app never updates from it)
        if: github.ref == 'refs/heads/all-phases'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp SalahTracker.apk SalahTracker-preview.apk
          gh release delete preview --yes --cleanup-tag || true
          git push origin :refs/tags/preview || true
          gh release create preview SalahTracker-preview.apk \
            --title "preview (not released)" \
            --notes "Preview build ${{ github.run_number }} from the all-phases branch. Installing it replaces the app on your phone and keeps your data." \
            --target "${GITHUB_SHA}" --prerelease --latest=false

      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          git push origin :refs/tags/latest || true
          echo '{"build":${{ github.run_number }}}' > version.json
          cat version.json
          gh release create latest SalahTracker.apk version.json \
            --title "latest" \
            --notes "Build ${{ github.run_number }}. Debug APK built from ${GITHUB_SHA} on ${GITHUB_REF_NAME}." \
            --target "${GITHUB_SHA}" \
            --latest
